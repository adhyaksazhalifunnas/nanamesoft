# CI — PRD §9.6.
#
# Order matters: the cheap checks run first so a typo fails in seconds rather
# than after a five-minute Playwright run. Content validation runs before the
# build because "you forgot the Outcome section" should be a one-line error,
# not a stack trace from a route handler.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # AC-16.1: the build must succeed without reaching GitHub, using the
  # committed cache. CI never runs sync here — that is a separate workflow.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      # §8.8 — schema, referential integrity and the editorial rules.
      - name: Validate content
        run: pnpm validate

      # §11.3 — "every foreground/background token pair is contrast-verified
      # in both themes". This is that rule, enforced.
      - name: Contrast tokens
        run: pnpm check:contrast

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm exec next build

      # §5.8 — fails on a regression, not just on a report.
      - name: JavaScript budget
        run: pnpm check:bundle

      - name: Check for secrets in the build output
        # §5.7: "CI greps the build output for known secret patterns."
        run: |
          if grep -rIEl 'gh[pousr]_[A-Za-z0-9]{16,}|re_[A-Za-z0-9]{16,}|0x4AAAAAAA' .next/static .next/server 2>/dev/null; then
            echo "::error::A credential-shaped string reached the build output."
            exit 1
          fi
          echo "No secret patterns found in .next/"

  e2e:
    name: Accessibility and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # Covers: axe-core at every breakpoint (AC-14.11), the §11.2
      # anti-pattern register, responsive integrity (AC-11.1), touch targets
      # (AC-11.2), the measure (AC-11.3), and the no-JavaScript path (AC-15.6).
      - name: Playwright
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
