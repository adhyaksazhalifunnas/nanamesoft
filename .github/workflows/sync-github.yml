# Nightly repository sync — PRD §5.4, "repository-update flow".
#
# Runs the sync, and commits the cache ONLY if it actually changed. A commit
# per night with no diff would produce a deploy per night with no change, which
# is noise in the history and wasted build minutes.
#
# The sync script exits 0 on any API failure and leaves the previous cache
# intact (§7.1.5), so a bad night at GitHub never turns into a red workflow or
# a broken site.
name: Sync GitHub data

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync
        env:
          # A fine-grained PAT with read-only public repository metadata access
          # and nothing else (§5.7). Rotate every 90 days — see
          # docs/DEPLOYMENT.md.
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: pnpm sync:github

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/github-cache.json; then
            echo "No change in repository data; nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-cache.json
          git commit -m "chore: sync github data"
          git push
